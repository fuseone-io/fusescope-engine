[package]
name = "fs-cache"
description = "Hybrid memory and SSD cache for Parquet footers, page indexes, sidecars and pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
# product names (FuseScope, DataFusion, OTLP) appear in docs everywhere
doc_markdown = "allow"
must_use_candidate = "allow"
