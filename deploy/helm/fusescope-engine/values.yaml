# One release runs the three roles: ingesters as a StatefulSet, each with
# its write-ahead log on a persistent volume, queriers and the compactor as
# Deployments. Secure by default: mTLS on both Flights and the backend's
# tenant JWTs on Flight SQL; development overrides it (ci/dev-values.yaml).

image:
  repository: ghcr.io/fuseone-io/fusescope-engine
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Secrets, created outside the chart, one per role, whose keys are the
# environment the engine reads its secrets from: FS_CATALOG_URL,
# FS_BUCKET_ACCESS_KEY and FS_BUCKET_SECRET_KEY. Each role has its own
# Postgres user and bucket identity (DESIGN.md 10.4): the ingester writes
# L0, the querier only reads, the compactor reads, writes and deletes. With
# workload identity, leave the bucket keys out and annotate the role's
# ServiceAccount instead. Every Secret name in this file must differ.
secrets:
  ingester: ""
  querier: ""
  compactor: ""
  # The one user allowed DDL, for the migration Job; its Secret needs only
  # FS_CATALOG_URL. Not needed with migration.enabled=false.
  migrator: ""

# One ServiceAccount per role; annotations bind workload identity, for
# example eks.amazonaws.com/role-arn. Pods never mount its API token.
serviceAccounts:
  ingester:
    annotations: {}
  querier:
    annotations: {}
  compactor:
    annotations: {}

# Changing a role's value rolls its pods: environment from Secrets is read
# at start, so a rotated credential needs a new value here or
# `kubectl rollout restart`.
rolloutTokens:
  ingester: ""
  querier: ""
  compactor: ""

catalog:
  maxConnections: 16

# The catalog's migrations run once per install and upgrade, in a Job
# before the workloads roll, as secrets.migrator; the roles never migrate,
# so their users need no DDL. Disabled, the operator migrates beforehand
# with `fusescope-engine admin migrate`.
migration:
  enabled: true
  # Retries of a failed migration, 0 to 10.
  backoffLimit: 3

bucket:
  name: ""
  prefix: ""
  # Empty for AWS S3; the endpoint of any other S3-compatible store.
  endpoint: ""
  region: ""
  allowHttp: false

tls:
  enabled: true
  # Secret with public-ca.crt (the backend's client CAs, Flight SQL) and
  # hot-ca.crt (the queriers' client CAs, the hot window): roots sharing no
  # key. Shared by the roles; it holds no private key.
  clientCASecret: ""
  # Each role's identity, a Secret with tls.crt and tls.key. The ingester's
  # serves the hot window and names *.<release>-ingester-hot.<namespace>.svc;
  # it must not chain to hot-ca.crt, or an ingester could scan the others.
  # The querier's serves Flight SQL, names <release>-flight, and is the one
  # identity issued under hot-ca.crt, with both serverAuth and clientAuth.
  # The compactor serves and dials no Flight and gets none.
  identities:
    ingester: ""
    querier: ""
  reloadIntervalSecs: 60

auth:
  # "jwt" (the backend's tenant JWTs, requires tls) or "token".
  mode: jwt
  # ConfigMap with jwks.json, the backend's Ed25519 public keys.
  jwksConfigMap: ""
  issuer: ""

log:
  level: info
  format: json

# A stop drains in flight work for this long; the pod gets more.
drainTimeoutSecs: 30
# Longest a start may take, the bucket's ownership check included, before
# the pod is restarted; liveness waits for it. 1 to 86400.
startupTimeoutSecs: 600

ingester:
  replicas: 2
  wal:
    size: 20Gi
    storageClassName: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

querier:
  replicas: 2
  spillSizeLimit: 10Gi
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

compactor:
  # One holds the lease at a time; a second stands by.
  replicas: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
