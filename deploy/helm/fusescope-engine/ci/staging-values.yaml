# What a staging release sets: mTLS and the backend's JWTs on, as the
# defaults have them, with the cluster's names.
secrets:
  ingester: fusescope-engine-ingester
  querier: fusescope-engine-querier
  compactor: fusescope-engine-compactor
  migrator: fusescope-engine-migrator
bucket:
  name: fusescope-staging
  region: us-east-1
serviceAccounts:
  compactor:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/fusescope-compactor
tls:
  clientCASecret: fusescope-engine-client-cas
  identities:
    ingester: fusescope-engine-ingester-tls
    querier: fusescope-engine-querier-tls
auth:
  jwksConfigMap: fusescope-backend-jwks
  issuer: fusescope-backend
