{{- if .Values.migration.enabled }}
{{- include "fse.validate" . }}
{{- $ctx := dict "Values" .Values "Release" .Release "Chart" .Chart "role" "compactor" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fse.name" . }}-migrate-config
  labels:
    {{- include "fse.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  config.toml: |
    {{- include "fse.config" $ctx | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fse.name" . }}-migrate
  labels:
    {{- include "fse.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "fse.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrator
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The catalog alone: no bucket is touched, no role starts.
          args: ["--config", "/etc/fusescope/config.toml", "admin", "migrate"]
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.migrator }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/fusescope/config.toml
              subPath: config.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "fse.name" . }}-migrate-config
{{- end }}
