{{- $ctx := dict "Values" .Values "Release" .Release "Chart" .Chart "role" "ingester" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fse.name" . }}-ingester-hot
  labels:
    {{- include "fse.labels" . | nindent 4 }}
spec:
  # Headless: each ingester is reached by its own name, which it advertises
  # for the hot window and its certificate carries.
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "fse.selector" $ctx | nindent 4 }}
  ports:
    - name: hot
      port: 8816
      targetPort: hot
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fse.name" . }}-ingest
  labels:
    {{- include "fse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fse.selector" $ctx | nindent 4 }}
  ports:
    - name: otlp
      port: 4317
      targetPort: otlp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fse.name" . }}-ingester
  labels:
    {{- include "fse.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingester
spec:
  serviceName: {{ include "fse.name" . }}-ingester-hot
  replicas: {{ .Values.ingester.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "fse.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fse.labels" . | nindent 8 }}
        app.kubernetes.io/component: ingester
      annotations:
        {{- include "fse.podAnnotations" $ctx | nindent 8 }}
    spec:
      {{- include "fse.pod" $ctx | nindent 6 }}
  # The WAL holds rows not yet flushed: it outlives the pod.
  volumeClaimTemplates:
    - metadata:
        name: wal
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.ingester.wal.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ingester.wal.size }}
