{{- include "fse.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fse.name" . }}-config
  labels:
    {{- include "fse.labels" . | nindent 4 }}
data:
  {{- range $role := list "ingester" "querier" "compactor" }}
  {{ $role }}.toml: |
    {{- include "fse.config" (dict "Values" $.Values "Release" $.Release "Chart" $.Chart "role" $role) | nindent 4 }}
  {{- end }}
