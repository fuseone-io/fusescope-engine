{{- range $role := list "ingester" "querier" "compactor" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fse.name" $ }}-{{ $role }}
  labels:
    {{- include "fse.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
  {{- with (index $.Values.serviceAccounts $role).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
