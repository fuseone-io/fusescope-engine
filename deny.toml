# cargo-deny configuration. CI fails on any violation.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Only permissive licenses compatible with Apache-2.0 distribution. The list
# matches the FuseScope backend policy (MIT, BSD, ISC, Apache-2.0) plus the
# licenses of the Rust standard ecosystem (Unicode, Zlib, CC0).
#
# BSL-1.0 (Boost Software License) is permissive and would be acceptable, but
# it is not listed until a dependency needs it with no MIT/Apache alternative.
# When that day comes, add it here with a comment and update the FuseScope
# CLAUDE.md in the same change. Never confuse it with BUSL-1.1 (Business
# Source License), which is not open source and stays forbidden.
#
# TLS roots: every TLS client uses the operating system trust store
# (rustls-native-certs) rather than the bundled webpki-roots crate, whose
# Mozilla CA data is CDLA-Permissive-2.0. Container images therefore ship the
# distribution's ca-certificates package.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.9
# allow-list entries not yet used by any dependency are fine
unused-allowed-license = "allow"

[advisories]
# RustSec advisories block the build. Every ignore below names the advisory,
# why the exposure is acceptable, and what removes it.
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # quick-xml 0.39 (via object_store 0.13, pinned by datafusion 55): quadratic
  # time and unbounded allocation while parsing XML. The parser only reads
  # responses from our own S3 endpoint, which is trusted infrastructure, so the
  # denial of service needs a compromised bucket server. Removed by object_store
  # 0.14 (quick-xml 0.41), which lands when datafusion moves to it. Revisit by
  # 2026-12-31.
  { id = "RUSTSEC-2026-0194", reason = "S3 response parsing only; fixed by object_store 0.14 with datafusion 56" },
  { id = "RUSTSEC-2026-0195", reason = "S3 response parsing only; fixed by object_store 0.14 with datafusion 56" },
  # zstd 0.13 / zstd-safe 7 (via arrow-ipc and parquet 59, pinned by datafusion
  # 55). Parquet and Arrow IPC use the bulk API only, and zstd-safe is built
  # with `std` alone: no reused streaming context (0391), no `Seekable`
  # (0398), no `decompress_stream` and no `legacy` feature (0403). Removed by
  # arrow and parquet depending on zstd 0.14 / zstd-safe 8, which lands with
  # the datafusion bump. Revisit by 2026-12-31.
  { id = "RUSTSEC-2026-0391", reason = "bulk API only, no reused streaming context; fixed by parquet on zstd 0.14" },
  { id = "RUSTSEC-2026-0398", reason = "Seekable feature and API unused; fixed by parquet on zstd-safe 8" },
  { id = "RUSTSEC-2026-0403", reason = "decompress_stream unused, bulk path unaffected, legacy feature off; fixed by parquet on zstd-safe 8" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace crates reference each other by path without a version
allow-wildcard-paths = true
# OpenSSL is replaced by rustls everywhere.
deny = [
  { crate = "openssl", reason = "use rustls" },
  { crate = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
