# cargo-deny configuration. CI fails on any violation.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Only permissive licenses compatible with Apache-2.0 distribution. The list
# matches the FuseScope backend policy (MIT, BSD, ISC, Apache-2.0) plus the
# licenses of the Rust standard ecosystem (Unicode, Zlib, CC0).
#
# BSL-1.0 (Boost Software License) is permissive and would be acceptable, but
# it is not listed until a dependency needs it with no MIT/Apache alternative.
# When that day comes, add it here with a comment and update the FuseScope
# CLAUDE.md in the same change. Never confuse it with BUSL-1.1 (Business
# Source License), which is not open source and stays forbidden.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.9
# allow-list entries not yet used by any dependency are fine
unused-allowed-license = "allow"

[advisories]
# RustSec advisories block the build.
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace crates reference each other by path without a version
allow-wildcard-paths = true
# OpenSSL is replaced by rustls everywhere.
deny = [
  { crate = "openssl", reason = "use rustls" },
  { crate = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
