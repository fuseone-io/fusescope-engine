# Development configuration for the services in compose.yaml.
# Secrets never live in this file: FS_CATALOG_URL, FS_BUCKET_ACCESS_KEY and
# FS_BUCKET_SECRET_KEY come from the environment (see the Makefile).

[server]
role = "all"
node_id = "dev-0"
flight_addr = "0.0.0.0:8815"   # Arrow Flight SQL for the Go backend
metrics_addr = "0.0.0.0:9464"  # Prometheus text exposition

[catalog]
max_connections = 8
migrate = true

[bucket]
kind = "s3"
name = "fusescope"
endpoint = "http://localhost:9100"
region = "us-east-1"
allow_http = true          # development only; production endpoints are https

[wal]
dir = "./data/wal"

[ingest]
listen = "0.0.0.0:4317"
hot_listen = "0.0.0.0:8816"    # internal: queriers read unflushed rows here
hot_advertise = "127.0.0.1:8816"
flush_interval_secs = 10       # short for development; production default is 30
# WAL group commit: batch limits, and the queue limits that turn into RESOURCE_EXHAUSTED
# wal_batch_records = 1024
# wal_batch_bytes = 16777216
# wal_linger_ms = 0
# wal_queue_records = 4096
# wal_queue_bytes = 67108864
# wal_queue_wait_ms = 2000
# anonymous_tenant = "<uuid>"   # development only: accept unauthenticated OTLP as this tenant

[query]
memory_bytes = 1073741824   # 1 GiB for development
timeout_secs = 60
max_rows = 1000000
spill_dir = "./data/spill"
# Decoded trace_id sidecars kept for trace lookups; 0 opens every overlapping file.
trace_index_cache_bytes = 268435456

[compactor]
purge_interval_secs = 60
# One compactor per deployment holds this lease; another takes over this long after a crash.
lease_ttl_secs = 30
# L0 to L1 compaction: closed hours only, up to 16 inputs or 2 GiB per pass, 512 MiB outputs.
compaction_interval_secs = 60
hour_close_delay_secs = 900
l1_target_bytes = 536870912
max_inputs_per_pass = 16
max_input_bytes = 2147483648
# Objects without a catalog row are deleted once seen that way for orphan_ttl_secs.
orphan_interval_secs = 3600
orphan_ttl_secs = 3600
sweep_objects_per_pass = 100000
sweep_deletes_per_pass = 10000
sweep_delete_backoff_secs = 600
sweep_tombstone_ttl_secs = 604800
quarantine_ttl_secs = 3600

[log]
level = "info"
format = "text"
