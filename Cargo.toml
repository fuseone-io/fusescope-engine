[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/fuseone-io/fusescope-engine"
authors = ["FuseOne <oss@fuseone.io>"]
# crates are internal to this workspace; cargo-deny only allows path deps for unpublished crates
publish = false

# Every crate inherits these. fs-cache and fs-index downgrade `unsafe_code`
# to `deny` locally because mmap paths may need audited unsafe blocks.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
module_name_repetitions = "allow"
# product names (FuseScope, DataFusion, OTLP) appear in docs everywhere
doc_markdown = "allow"
must_use_candidate = "allow"

# Shared dependency versions. Crates opt in with `foo = { workspace = true }`.
# Versions follow the pins of datafusion 55 (arrow/parquet 59, object_store 0.13)
# and opentelemetry-proto 0.33 (prost/tonic 0.14).
[workspace.dependencies]
# format and engine
arrow = "59"
parquet = "59"
datafusion = "55"
arrow-flight = { version = "59", features = ["flight-sql"] }
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }
# runtime
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
prost = "0.14"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# storage helpers
foyer = "0.19"
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "chrono", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
roaring = "0.11"
xorf = "0.11"
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }
crc32c = "0.6"
ulid = "1"
# misc
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
# dev
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
