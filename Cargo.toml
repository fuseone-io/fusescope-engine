[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/fuseone-io/fusescope-engine"
authors = ["FuseOne <oss@fuseone.io>"]
# crates are internal to this workspace; cargo-deny only allows path deps for unpublished crates
publish = false

# Every crate inherits these. fs-cache and fs-index downgrade `unsafe_code`
# to `deny` locally because mmap paths may need audited unsafe blocks.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
module_name_repetitions = "allow"
# product names (FuseScope, DataFusion, OTLP) appear in docs everywhere
doc_markdown = "allow"
must_use_candidate = "allow"

# Shared dependency versions. Crates opt in with `foo = { workspace = true }`.
# Nothing here is pulled until a member references it, so the skeleton builds
# offline. Versions are pinned when each crate is actually wired in.
[workspace.dependencies]
# format and engine
arrow = "57"
parquet = "57"
datafusion = "52"
arrow-flight = { version = "57", features = ["flight-sql"] }
object_store = { version = "0.12", features = ["aws", "gcp", "azure"] }
# runtime
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# storage helpers
foyer = "0.19"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono"] }
roaring = "0.11"
xorf = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crc32fast = "1"
ulid = "1"
# misc
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
