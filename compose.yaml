# Local development dependencies. `make dev-up` starts them, `make dev-down` stops them.
# Ports are offset from the defaults so they do not clash with host installs
# (ClickHouse of the FuseScope dev environment owns 9000).
#
# RustFS (Apache-2.0) stands in for S3. MinIO images are no longer publicly
# distributed, and any S3-compatible store works for development.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fusescope
      POSTGRES_PASSWORD: fusescope
      POSTGRES_DB: fusescope
    ports:
      - "${FS_DEV_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusescope -d fusescope"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: fusescope
      RUSTFS_SECRET_KEY: fusescope-dev
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - s3-data:/data

  # One-shot: creates the development bucket once the S3 endpoint answers.
  bucket-init:
    image: amazon/aws-cli:2.38.5
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: fusescope
      AWS_SECRET_ACCESS_KEY: fusescope-dev
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $(seq 1 30); do
          aws --endpoint-url http://s3:9000 s3 ls >/dev/null 2>&1 && break
          sleep 1
        done
        aws --endpoint-url http://s3:9000 s3 mb s3://fusescope 2>/dev/null || true
        aws --endpoint-url http://s3:9000 s3 ls
    restart: "no"

volumes:
  postgres-data:
  s3-data:
