# Local development dependencies. `make dev-up` starts them, `make dev-down` stops them.
# Ports are offset from the defaults so they do not clash with host installs.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fusescope
      POSTGRES_PASSWORD: fusescope
      POSTGRES_DB: fusescope
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusescope -d fusescope"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fusescope
      MINIO_ROOT_PASSWORD: fusescope-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
