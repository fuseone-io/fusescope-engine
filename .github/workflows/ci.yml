name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fusescope
          POSTGRES_PASSWORD: fusescope
          POSTGRES_DB: fusescope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fusescope -d fusescope"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      FS_TEST_DATABASE_URL: postgres://fusescope:fusescope@localhost:5432/fusescope
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fusescope
          POSTGRES_PASSWORD: fusescope
          POSTGRES_DB: fusescope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fusescope -d fusescope"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fusescope-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/image-check.sh fusescope-engine:ci postgres://fusescope:fusescope@localhost:5432/fusescope
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources bans
