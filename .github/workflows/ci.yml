name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fusescope
          POSTGRES_PASSWORD: fusescope
          POSTGRES_DB: fusescope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fusescope -d fusescope"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      FS_TEST_DATABASE_URL: postgres://fusescope:fusescope@localhost:5432/fusescope
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fusescope-engine:ci
          build-args: PROFILE=ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - run: scripts/image-check.sh fusescope-engine:ci
        env:
          SBOM_OUT: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: fusescope-engine-sbom
          path: sbom.cdx.json
          if-no-files-found: error
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM}/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
        env:
          KUBECONFORM: v0.7.0
      # The engine's chart lives in fusescope-charts; checking it here against
      # the image just built catches a configuration change that breaks it.
      - uses: actions/checkout@v4
        with:
          repository: fuseone-io/fusescope-charts
          path: fusescope-charts
      - run: scripts/fusescope-engine-chart-check.sh --image fusescope-engine:ci
        working-directory: fusescope-charts
  # Tags read the cache of main alone: main keeps the release profile's
  # dependency layer warm so a release compiles only the workspace.
  release-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: cook
          build-args: PROFILE=release
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources bans
