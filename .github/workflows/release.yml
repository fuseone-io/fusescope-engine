name: release

# A tag v<version> publishes the image at that version to GHCR, only after
# the same image check CI runs passes on it, signed with cosign keyless,
# with build provenance and the CycloneDX SBOM attested by digest, and the
# SBOM attached to the GitHub release. linux/amd64 only for now: a Rust
# release build under QEMU takes hours.
on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fusescope-engine

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: the tag is the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fusescope-engine:release
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/image-check.sh fusescope-engine:release
        env:
          SBOM_OUT: sbom.cdx.json
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        id: push
        run: |
          version=${GITHUB_REF_NAME#v}
          docker tag fusescope-engine:release "$IMAGE:$version"
          docker push "$IMAGE:$version"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$version")
          echo "digest=${reference#*@}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.2
      - name: sign and attest the SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: GitHub release with the SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cp sbom.cdx.json "fusescope-engine-${GITHUB_REF_NAME}.cdx.json"
          gh release create "$GITHUB_REF_NAME" "fusescope-engine-${GITHUB_REF_NAME}.cdx.json" \
            --verify-tag --prerelease --title "fusescope-engine ${GITHUB_REF_NAME}" \
            --notes "Experimental. Image \`$IMAGE:${GITHUB_REF_NAME#v}\` (linux/amd64), digest \`$DIGEST\`, signed with cosign keyless, with build provenance and the CycloneDX SBOM attested by digest; the SBOM is attached."
